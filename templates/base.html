<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Personal Blog
        {% endblock %}
    </title>
</head>

<body>

    <header>
        <nav>
            <a href="{% url 'blog:home' %}">
                Personal Blog
            </a>

            <a href="{% url 'blog:about' %}">
                About
            </a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>
            Personal Blog
        </p>
    </footer>

</body>
</html>
