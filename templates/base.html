{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Personal Blog
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/styles.css' %}"
    >
</head>

<body>

    <header class="site-header">

        <div class="container header-inner">

            <a
                class="site-logo"
                href="{% url 'blog:home' %}"
            >
                DevBlog
            </a>

            <nav class="main-navigation">

                <a href="{% url 'blog:home' %}">
                    Home
                </a>

                <a href="{% url 'blog:about' %}">
                    About
                </a>

            </nav>

        </div>

    </header>


    <main class="main-content">

        <div class="container">

            {% block content %}
            {% endblock %}

        </div>

    </main>


    <footer class="site-footer">

        <div class="container">

            <p>
                © Personal Blog.
                Built with Django.
            </p>

        </div>

    </footer>


    <script src="{% static 'js/main.js' %}"></script>

</body>

</html>
